<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="get">

        <p>
            <label for="inum1">Digite um número:</label>
            <input type="number" name="num1" id="inum1" required min="0" max="50" oninput="isoma.innerHTML = Number(inum1.value) + Number(inum2.value)">
        </p>
        <p>
            <label for="inum2">Digite um número:</label>
            <input type="number" name="num2" id="inum2" required min="00" max="50" oninput="isoma.innerHTML = Number(inum1.value) + Number(inum2.value)">
        </p>
         <p>
            <label for="isoma">A soma é</label>
            <output name="soma" id="isoma">0</output>
        </p>

        <p>
            <label for="inum">Escolha</label>
            <input type="range" name="num" id="inum" min="1" max="10" value="5" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">5</output>
        </p>

        <p>
            <label for="iano">Em que ano você nasceu?</label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" value="2000" oninput="idade.innerHTML = Number (2026) - Number(iano.value)">
        </p>

        <p>
            <label for="Idade"> Sua idade é:</label>
            <output id="idade">26</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
       

    </form>

</body>
</html>
