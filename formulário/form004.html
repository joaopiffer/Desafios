<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on"></form>
    <fieldset>
        <legend>Dados Pessoais</legend>
        <p>
            <label for="inome">Nome Completo:</label>
            <input type="text" name="nome" id="inome" autocomplete="name" placeholder="Nome Completo" minlength="3" required>
        </p>
        <p>
            <label for="iemail">Email:</label>
            <input type="text" name="email" id="iemail" autocomplete="email" placeholder="12345@6789.com" required>
        </p>
        <p>
            <label for="inum">Número de Telefone:</label>
            <input type="tel" name="num" id="inum" autocomplete="tel" required placeholder="99 99999-9999">
        </p>
    </fieldset>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</body>
</html>
