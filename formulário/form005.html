<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome Completo:</label>
                <input type="text" name="nome" id="inome" autocomplete="name" required minlength="3">
            </p>
            <p>
                <label for="iidade">Idade</label>
                <input type="number" name="idade" id="iidade" min="05" max="50">
            </p>
            <p>
                <input type="radio" name="sexo" id="iman">
                <label for="iman">Masculino</label>
                <input type="radio" name="sexo" id="igir">
                <label for="igir">Feminino</label>
            </p>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="fut" id="ifut">
            <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="bas" id="ibas">
            <label for="ibas">Basquete</label> <br>
            <input type="checkbox" name="ten" id="iten">
            <label for="iten">Tênis</label> <br>
            <input type="checkbox" name="nat" id="inat">
            <label for="inat">Natação</label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    
</body>
</html>
