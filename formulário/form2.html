<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formuláriop</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
    <p>
        <label for="iusu">Usuário</label>
        <input type="text" name="usu" id="iusu" required minlength="3" maxlength="15" size="15" placeholder="Nome do Usuário"
        autocomplete="username">
    </p>
    <p>
        <label for="isenha">Senha</label>
        <input type="password" name="senha" id="isenha" required minlength="8" size="15" placeholder="Mínimo 8 letras" autocomplete="current-password">
    </p>
    <p>
        <input type="submit" value="Login">
        <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
